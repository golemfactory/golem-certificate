name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Tests
    env:
      RUSTFLAGS: "-D warnings -C opt-level=z -C debuginfo=1"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: rust

      - name: Setup build cache
        uses: Swatinem/rust-cache@v2

      - name: Install smartcard libraries ( Linux only )
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y libpcsclite-dev

      - name: Clippy ( all-features on Linux )
        if: runner.os == 'Linux'
        run: mise run ci:clippy-all-features

      - name: Clippy ( default features on not Linux )
        if: runner.os != 'Linux'
        run: mise run ci:clippy

      - name: Check formatting
        run: mise run ci:fmt

      - name: Unit tests
        run: mise run ci:test

      - name: Build cli with smartcard ( Linux only )
        if: runner.os == 'Linux'
        run: mise run ci:build-smartcard
