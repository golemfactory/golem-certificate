name: Build Release

on:
  push:
    tags:
      - v*
      - pre-rel-*
env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: CI
    runs-on: ${{ matrix.os }}-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu
          - windows
          - macos

    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: rust

      - uses: Swatinem/rust-cache@v2

      - name: Install smartcard libraries ( Linux only )
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y libpcsclite-dev

      - name: Build
        if: runner.os != 'Linux'
        run: mise run release:build

      - name: Build cli with smartcard ( Linux only )
        if: runner.os == 'Linux'
        run: mise run release:build-smartcard

      - name: Pack
        id: pack
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          bash .ci/pack-build.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            releases/golem-certificate-cli-*
          prerelease: ${{ startsWith(github.ref, 'refs/tags/pre-rel-v') }}
